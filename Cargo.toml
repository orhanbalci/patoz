[workspace]
members = [".", "patoz-wasm"]
exclude = ["pdb-harvester"]

[package]
name = "patoz"
version = "0.2.0"
edition = "2021"
authors = ["Orhan Balci <orhanbalci@gmail.com>"]
description = "Protein Data Bank (PDB) file parser and writer with typed records and a structure model"
homepage = "https://github.com/orhanbalci/patoz"
repository = "https://github.com/orhanbalci/patoz"
keywords = ["pdb", "protein", "bioinformatics", "parser", "structure"]
categories = ["parser-implementations", "science"]
rust-version = "1.77"
license = "MIT"
exclude = ["pdb-harvester", "pdb_harvester", "patoz-wasm", "docs", ".github"]
documentation = "https://docs.rs/patoz"
readme = "README.md"

[dependencies]
nom = "8"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
# Derives serde::Serialize for all record types
serde = ["dep:serde", "chrono/serde"]

[dev-dependencies]
serde_json="1.0"


