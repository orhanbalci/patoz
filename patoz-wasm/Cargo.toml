[package]
name = "patoz-wasm"
version = "0.1.0"
edition = "2018"
authors = ["Orhan Balci <orhanbalci@gmail.com>"]
description = "WebAssembly bindings for the patoz Protein Data Bank (pdb) file parser"
repository = "https://github.com/orhanbalci/patoz.git"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
patoz = { path = "..", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
